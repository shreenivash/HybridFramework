name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api-examples:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Install modules
        run: mvn -B -q -DskipTests install

      - name: Run API examples
        run: mvn -B -pl examples test

      - name: Generate Allure report
        if: always()
        run: mvn -B -pl examples allure:report

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: examples/target/site/allure-report
          if-no-files-found: ignore
