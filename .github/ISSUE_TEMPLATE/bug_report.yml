name: Bug report
description: Report a problem with the Hybrid Framework
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve Hybrid Framework. Please search existing issues first.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Commands, suite XML, and Grid/Appium setup.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [core, web, mobile, api, testng-engine, examples, jenkins, docs]
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      placeholder: Java 21, Selenium 4.27, OS, Grid version
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / Allure attachments
      render: text
