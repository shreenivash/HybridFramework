<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="annTitle annDesc">
  <title id="annTitle">From @ApiLoadStep to export-suite JMX</title>
  <desc id="annDesc">Annotate TestNG API tests, run export-suite, generate JMeter plan without a separate script.</desc>
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ebe4d6"/>
      <stop offset="100%" stop-color="#f3efe6"/>
    </linearGradient>
    <filter id="sh3">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#1a1814" flood-opacity="0.14"/>
    </filter>
    <marker id="arr3" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2d5a3d"/>
    </marker>
  </defs>
  <rect width="800" height="450" fill="url(#bg3)"/>

  <text x="400" y="36" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#1a1814">Reuse the API suite — export load without rewriting JMeter</text>
  <text x="400" y="56" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#5c564c">Annotate · scan · generate · run with -Jtps</text>

  <!-- IDE / code panel -->
  <g filter="url(#sh3)">
    <rect x="40" y="72" width="420" height="300" rx="10" fill="#1e1e1e" stroke="#1a1814" stroke-width="2"/>
    <rect x="40" y="72" width="420" height="28" rx="10" fill="#2d2d2d"/>
    <rect x="40" y="88" width="420" height="12" fill="#2d2d2d"/>
    <circle cx="58" cy="86" r="5" fill="#8c3424"/>
    <circle cx="74" cy="86" r="5" fill="#c4a035"/>
    <circle cx="90" cy="86" r="5" fill="#2d5a3d"/>
    <text x="220" y="90" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#aaa">JsonPlaceholderApiTest.java</text>
  </g>

  <g font-family="ui-monospace, monospace" font-size="11">
    <text x="56" y="118" fill="#6a9955">@ApiLoadSuite</text>
    <text x="56" y="134" fill="#d4d4d4">(baseUrl = </text>
    <text x="148" y="134" fill="#ce9178">"https://jsonplaceholder…"</text>
    <text x="56" y="150" fill="#d4d4d4">)</text>
    <text x="56" y="174" fill="#569cd6">public class</text>
    <text x="148" y="174" fill="#4ec9b0"> JsonPlaceholderApiTest</text>
    <text x="56" y="198" fill="#d4d4d4">{</text>

    <text x="72" y="222" fill="#6a9955">@Test</text>
    <text x="120" y="222" fill="#d4d4d4">(groups = </text>
    <text x="200" y="222" fill="#ce9178">"api"</text>
    <text x="232" y="222" fill="#d4d4d4">)</text>
    <text x="72" y="238" fill="#c586c0">@ApiLoadStep</text>
    <text x="72" y="254" fill="#d4d4d4">(method = </text>
    <text x="152" y="254" fill="#ce9178">"GET"</text>
    <text x="192" y="254" fill="#d4d4d4">, path = </text>
    <text x="272" y="254" fill="#ce9178">"/posts/1"</text>
    <text x="72" y="270" fill="#d4d4d4">)</text>
    <text x="72" y="294" fill="#dcdcaa">void</text>
    <text x="108" y="294" fill="#dcdcaa"> getPost</text>
    <text x="168" y="294" fill="#d4d4d4">() {</text>
    <text x="88" y="310" fill="#9cdcfe">api</text>
    <text x="112" y="310" fill="#d4d4d4">.get(</text>
    <text x="152" y="310" fill="#ce9178">"/posts/1"</text>
    <text x="224" y="310" fill="#d4d4d4">);</text>
    <text x="88" y="326" fill="#d4d4d4">// assertions, schema, Allure…</text>
    <text x="72" y="350" fill="#d4d4d4">}</text>
  </g>

  <!-- Highlight annotation -->
  <rect x="68" y="228" width="200" height="48" rx="4" fill="none" stroke="#8c3424" stroke-width="2"/>
  <text x="168" y="368" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#8c3424">marks this call for load export</text>

  <!-- Arrow to CLI -->
  <path d="M470 220 L510 220" stroke="#2d5a3d" stroke-width="3" marker-end="url(#arr3)"/>

  <!-- Terminal -->
  <g filter="url(#sh3)">
    <rect x="520" y="72" width="240" height="148" rx="10" fill="#0f1410" stroke="#2d5a3d" stroke-width="2"/>
    <text x="536" y="96" font-family="ui-monospace, monospace" font-size="10" fill="#7ddf9a">$ mvn -pl perf exec:java \</text>
    <text x="536" y="112" font-family="ui-monospace, monospace" font-size="9" fill="#a8c4b0">  -Dexec.args=</text>
    <text x="536" y="128" font-family="ui-monospace, monospace" font-size="9" fill="#e8f2eb">"export-suite \</text>
    <text x="548" y="144" font-family="ui-monospace, monospace" font-size="8" fill="#c4dcc8">--testPackage com.qa.examples.api \</text>
    <text x="548" y="158" font-family="ui-monospace, monospace" font-size="8" fill="#c4dcc8">--out target/api-suite.jmx \</text>
    <text x="548" y="172" font-family="ui-monospace, monospace" font-size="8" fill="#c4dcc8">--tps 50 --users 200"</text>
    <text x="536" y="200" font-family="ui-monospace, monospace" font-size="9" fill="#7ddf9a">Wrote api-suite.jmx (8 steps)</text>
  </g>

  <!-- JMX output -->
  <g filter="url(#sh3)">
    <rect x="520" y="238" width="240" height="134" rx="10" fill="#fff" stroke="#8c3424" stroke-width="2"/>
    <rect x="520" y="238" width="240" height="28" rx="10" fill="#8c3424"/>
    <rect x="520" y="254" width="240" height="12" fill="#8c3424"/>
    <text x="640" y="256" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#fff">api-suite.jmx</text>
  </g>
  <g font-family="ui-monospace, monospace" font-size="9" fill="#1a1814">
    <text x="536" y="284">Thread Group · 200 users</text>
    <text x="536" y="300">→ GET /posts/1</text>
    <text x="536" y="316">→ GET /posts</text>
    <text x="536" y="332">→ POST /posts …</text>
    <text x="536" y="352" fill="#8c3424" font-weight="600">+ Constant Throughput Timer</text>
  </g>

  <!-- Alt paths -->
  <rect x="40" y="388" width="360" height="48" rx="6" fill="#fff" stroke="#5c564c"/>
  <text x="220" y="408" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#1a1814">Also: YAML journey · record (-Dapi.load.record=true)</text>
  <text x="220" y="424" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#5c564c">Same perf CLI → same fixed-TPS JMX</text>

  <rect x="420" y="388" width="340" height="48" rx="6" fill="#fff" stroke="#5c564c"/>
  <text x="590" y="408" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#8c3424">Watch-out</text>
  <text x="590" y="424" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#5c564c">Parallel @Test methods ≠ one user session — design E2E order</text>
</svg>
