<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="railsTitle railsDesc">
  <title id="railsTitle">One API journey, two execution rails</title>
  <desc id="railsDesc">Shared HTTP steps feed functional TestNG checks and JMeter load at fixed TPS.</desc>
  <rect width="800" height="500" fill="#f3efe6"/>

  <text x="400" y="36" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#1a1814">Same HTTP story — two runners</text>
  <text x="400" y="56" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#5c564c">Checkout-style journey (token → resource → update)</text>

  <!-- Left: functional -->
  <rect x="24" y="78" width="200" height="248" rx="8" fill="#fff" stroke="#2d5a3d" stroke-width="2"/>
  <rect x="24" y="78" width="200" height="40" rx="8" fill="#2d5a3d"/>
  <rect x="24" y="106" width="200" height="12" fill="#2d5a3d"/>
  <text x="124" y="104" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#fff">Functional rail</text>
  <text x="124" y="138" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#1a1814">TestNG + REST Assured</text>
  <text x="124" y="156" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#5c564c">parallel methods</text>
  <text x="124" y="172" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#5c564c">status · schema · JSON</text>
  <rect x="44" y="188" width="160" height="26" rx="13" fill="#e8f2eb" stroke="#2d5a3d"/>
  <text x="124" y="205" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#2d5a3d">CI gate · 20 min SLA</text>
  <text x="124" y="240" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#5c564c">Question:</text>
  <text x="124" y="258" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#1a1814">Did we break the contract?</text>
  <line x1="224" y1="200" x2="248" y2="200" stroke="#2d5a3d" stroke-width="3"/>
  <circle cx="236" cy="200" r="5" fill="#2d5a3d"/>

  <!-- Center: journey -->
  <rect x="248" y="78" width="304" height="300" rx="8" fill="#fff" stroke="#1a1814" stroke-width="2"/>
  <rect x="248" y="78" width="304" height="40" rx="8" fill="#1a1814"/>
  <rect x="248" y="106" width="304" height="12" fill="#1a1814"/>
  <text x="400" y="104" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" font-weight="600" fill="#f3efe6">API journey (ordered steps)</text>

  <g font-family="ui-monospace, monospace" font-size="11">
    <rect x="268" y="132" width="264" height="48" rx="6" fill="#f3efe6" stroke="#5c564c"/>
    <text x="280" y="152" fill="#8c3424" font-weight="700">1</text>
    <text x="296" y="152" fill="#1a1814" font-weight="600">POST</text>
    <text x="336" y="152" fill="#1a1814">/auth/login</text>
    <text x="280" y="168" fill="#5c564c" font-size="10">extract token → ${token}</text>

    <path d="M400 184 v14" stroke="#8c3424" stroke-width="2"/>
    <polygon points="400,198 396,190 404,190" fill="#8c3424"/>

    <rect x="268" y="206" width="264" height="48" rx="6" fill="#f3efe6" stroke="#5c564c"/>
    <text x="280" y="226" fill="#8c3424" font-weight="700">2</text>
    <text x="296" y="226" fill="#1a1814" font-weight="600">GET</text>
    <text x="336" y="226" fill="#1a1814">/posts/1</text>
    <text x="280" y="242" fill="#5c564c" font-size="10">Authorization: Bearer ${token}</text>

    <path d="M400 258 v14" stroke="#8c3424" stroke-width="2"/>
    <polygon points="400,272 396,264 404,264" fill="#8c3424"/>

    <rect x="268" y="280" width="264" height="48" rx="6" fill="#f3efe6" stroke="#5c564c"/>
    <text x="280" y="300" fill="#8c3424" font-weight="700">3</text>
    <text x="296" y="300" fill="#1a1814" font-weight="600">PATCH</text>
    <text x="346" y="300" fill="#1a1814">/posts/1</text>
    <text x="280" y="316" fill="#5c564c" font-size="10">assert in tests · JMX sampler</text>
  </g>

  <!-- Right: load -->
  <rect x="576" y="78" width="200" height="248" rx="8" fill="#fff" stroke="#8c3424" stroke-width="2"/>
  <rect x="576" y="78" width="200" height="40" rx="8" fill="#8c3424"/>
  <rect x="576" y="106" width="200" height="12" fill="#8c3424"/>
  <text x="676" y="104" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#fff">Load rail</text>
  <text x="676" y="138" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#1a1814">JMeter .jmx</text>
  <text x="676" y="156" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#5c564c">export-suite / YAML</text>
  <text x="676" y="172" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#5c564c">Constant Throughput</text>
  <text x="676" y="184" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#5c564c">Timer (fixed TPS)</text>
  <rect x="596" y="196" width="160" height="26" rx="13" fill="#f5e8e4" stroke="#8c3424"/>
  <text x="676" y="213" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" font-weight="600" fill="#8c3424">-Jtps=50</text>
  <text x="676" y="240" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#5c564c">Question:</text>
  <text x="676" y="258" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#1a1814">Survive peak at this rate?</text>
  <line x1="552" y1="200" x2="576" y2="200" stroke="#8c3424" stroke-width="3"/>
  <circle cx="564" cy="200" r="5" fill="#8c3424"/>

  <!-- Footer -->
  <rect x="48" y="400" width="704" height="76" rx="8" fill="#fff" stroke="#8c3424" stroke-width="1.5"/>
  <text x="400" y="426" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#8c3424">Risk when rails diverge</text>
  <text x="400" y="446" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#5c564c">Functional suite catches API drift early.</text>
  <text x="400" y="462" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#5c564c">Load script keeps old paths until someone updates the shared journey.</text>
</svg>
